  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SERPIENTES Y ESCALERAS - Arena 50</title>
    <meta name="description" content="Juego de capacitación corporativa y gamificación estilo Serpientes y Escaleras en 5 terrazas con estética industrial Squid Game, 50 casillas, ductos neumáticos, andamios de acero, cartas tácticas y gestión Excel." />
    <meta property="og:title" content="SERPIENTES Y ESCALERAS - Arena 50" />
    <meta property="og:description" content="Juego de capacitación corporativa y gamificación estilo Serpientes y Escaleras en 5 terrazas con estética industrial Squid Game, 50 casillas, ductos neumáticos, andamios de acero, cartas tácticas y gestión Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #090a0f;
        color: #f1f5f9;
        margin: 0;
        overflow-x: hidden;
      }
      .font-display {
        font-family: 'Chakra Petch', sans-serif;
      }

      /* Global Keyframes for Character Walk-Cycle, Projectiles & Tactical Shockwaves */
      @keyframes walk-bob {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-4px) rotate(1.2deg); }
        50% { transform: translateY(0.5px); }
        75% { transform: translateY(-4px) rotate(-1.2deg); }
      }
      @keyframes leg-swing-left {
        0% { transform: rotate(-28deg); }
        50% { transform: rotate(28deg); }
        100% { transform: rotate(-28deg); }
      }
      @keyframes leg-swing-right {
        0% { transform: rotate(28deg); }
        50% { transform: rotate(-28deg); }
        100% { transform: rotate(28deg); }
      }
      @keyframes arm-swing-left {
        0% { transform: rotate(32deg); }
        50% { transform: rotate(-32deg); }
        100% { transform: rotate(32deg); }
      }
      @keyframes arm-swing-right {
        0% { transform: rotate(-32deg); }
        50% { transform: rotate(32deg); }
        100% { transform: rotate(-32deg); }
      }
      @keyframes token-shake {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-3px, 2px) rotate(-3deg); }
        40% { transform: translate(3px, -2px) rotate(3deg); }
        60% { transform: translate(-3px, -1px) rotate(-2deg); }
        80% { transform: translate(2px, 2px) rotate(2deg); }
      }
      @keyframes shockwave-pulse {
        0% { transform: scale(0.9); opacity: 1; border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.8); }
        100% { transform: scale(1.4); opacity: 0; border-color: rgba(244, 63, 94, 0); box-shadow: 0 0 45px rgba(244, 63, 94, 0); }
      }
    </style>
  </head>
  <body class="bg-[#090a0f] text-slate-100 antialiased selection:bg-rose-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
